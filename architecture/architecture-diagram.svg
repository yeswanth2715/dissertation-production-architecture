<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Agile dissertation production architecture</title>
  <desc id="arch-desc">Three-layer architecture showing reusable governance, learning routing, utility rules, topic-specific knowledge base, generation workflow, quality checks, and feedback loops.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4f4f"/>
    </marker>
    <style>
      .bg { fill: #f7f5ef; }
      .title { font: 700 28px Arial, sans-serif; fill: #183d3d; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #425c5c; }
      .lane { fill: none; stroke: #b7c6bd; stroke-width: 2; stroke-dasharray: 8 7; }
      .lane-title { font: 700 14px Arial, sans-serif; fill: #6a5b2d; }
      .box { stroke: #2f4f4f; stroke-width: 2; rx: 10; ry: 10; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #183d3d; }
      .box-text { font: 400 13px Arial, sans-serif; fill: #243b3b; }
      .line { fill: none; stroke: #2f4f4f; stroke-width: 2.2; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #607d7d; stroke-width: 1.7; marker-end: url(#arrow); }
      .note { font: 700 13px Arial, sans-serif; fill: #7a3e20; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="860"/>
  <text class="title" x="60" y="54">Agile Dissertation Production Architecture</text>
  <text class="subtitle" x="60" y="80">Reusable rules, deterministic scripts, fresh knowledge bases, source-based outputs, and routed /learn updates.</text>

  <rect class="lane" x="40" y="105" width="1200" height="165" rx="18" ry="18"/>
  <text class="lane-title" x="60" y="130">Reusable governance layer</text>

  <rect class="box" x="70" y="155" width="220" height="82" fill="#e7f0ea"/>
  <text class="box-title" x="92" y="184">Guidelines</text>
  <text class="box-text" x="92" y="209">Rules, word count, ethics</text>
  <text class="box-text" x="92" y="227">Harvard referencing</text>

  <rect class="box" x="330" y="155" width="220" height="82" fill="#f0e7d8"/>
  <text class="box-title" x="352" y="184">Templates</text>
  <text class="box-text" x="352" y="209">Document shell and order</text>
  <text class="box-text" x="352" y="227">Title, TOC, declarations</text>

  <rect class="box" x="590" y="155" width="220" height="82" fill="#e7eaf2"/>
  <text class="box-title" x="612" y="184">Learn Router</text>
  <text class="box-text" x="612" y="209">skills.md for judgement</text>
  <text class="box-text" x="612" y="227">utils/config for checks</text>

  <rect class="box" x="850" y="155" width="220" height="82" fill="#f2e7e3"/>
  <text class="box-title" x="872" y="184">Policies</text>
  <text class="box-text" x="872" y="209">Performance, routing, QA</text>
  <text class="box-text" x="872" y="227">Originality and outputs</text>

  <rect class="box" x="1100" y="155" width="105" height="82" fill="#f6efd7"/>
  <text class="box-title" x="1120" y="184">control</text>
  <text class="box-text" x="1120" y="209">Local only</text>
  <text class="box-text" x="1120" y="227">Gitignored</text>

  <rect class="lane" x="40" y="300" width="1200" height="220" rx="18" ry="18"/>
  <text class="lane-title" x="60" y="325">Topic-specific project layer</text>

  <rect class="box" x="70" y="360" width="230" height="95" fill="#e8f3f4"/>
  <text class="box-title" x="92" y="390">Project Discovery</text>
  <text class="box-text" x="92" y="416">Identify existing files</text>
  <text class="box-text" x="92" y="434">Classify research type</text>

  <rect class="box" x="360" y="350" width="260" height="115" fill="#ffffff"/>
  <text class="box-title" x="385" y="382">Fresh Knowledge Base</text>
  <text class="box-text" x="385" y="408">Research brief and claims</text>
  <text class="box-text" x="385" y="426">Literature map and methods</text>
  <text class="box-text" x="385" y="444">Findings and citation map</text>

  <rect class="box" x="690" y="360" width="220" height="95" fill="#edf0e3"/>
  <text class="box-title" x="714" y="390">Task Planner</text>
  <text class="box-text" x="714" y="416">Run project.yaml + scripts</text>
  <text class="box-text" x="714" y="434">Load relevant context only</text>

  <rect class="box" x="980" y="360" width="210" height="95" fill="#f0e6df"/>
  <text class="box-title" x="1002" y="390">Model Router</text>
  <text class="box-text" x="1002" y="416">Low, medium, or high</text>
  <text class="box-text" x="1002" y="434">After deterministic checks</text>

  <rect class="lane" x="40" y="550" width="1200" height="235" rx="18" ry="18"/>
  <text class="lane-title" x="60" y="575">Generation, QA, and feedback layer</text>

  <rect class="box" x="70" y="620" width="250" height="100" fill="#f8fbfb"/>
  <text class="box-title" x="93" y="650">Scripts + Agents</text>
  <text class="box-text" x="93" y="676">Scan, stats, QA by script</text>
  <text class="box-text" x="93" y="694">Model writes from KB only</text>

  <rect class="box" x="360" y="610" width="280" height="120" fill="#fffdf5"/>
  <text class="box-title" x="384" y="642">Required Outputs</text>
  <text class="box-text" x="384" y="668">Generate up to Chapter Three</text>
  <text class="box-text" x="384" y="686">survey-questionnaire.docx/md</text>
  <text class="box-text" x="384" y="704">dissertation and feedback outputs</text>

  <rect class="box" x="700" y="620" width="210" height="100" fill="#f3f6ee"/>
  <text class="box-title" x="724" y="650">Fast QA</text>
  <text class="box-text" x="724" y="676">scripts/fast_qa.py checks</text>
  <text class="box-text" x="724" y="694">No render by default</text>

  <rect class="box" x="980" y="620" width="210" height="100" fill="#f5ede7"/>
  <text class="box-title" x="1002" y="650">Final QA</text>
  <text class="box-text" x="1002" y="676">Render only for final DOCX</text>
  <text class="box-text" x="1002" y="694">PDF/page/image/a11y checks</text>

  <path class="line" d="M 290 196 L 330 196"/>
  <path class="line" d="M 550 196 L 590 196"/>
  <path class="line" d="M 810 196 L 850 196"/>
  <path class="thin" d="M 180 237 C 180 292 185 310 185 360"/>
  <path class="thin" d="M 440 237 C 440 292 490 300 490 350"/>
  <path class="thin" d="M 700 237 C 700 300 800 300 800 360"/>
  <path class="line" d="M 300 407 L 360 407"/>
  <path class="line" d="M 620 407 L 690 407"/>
  <path class="line" d="M 910 407 L 980 407"/>
  <path class="line" d="M 1085 455 C 1085 540 195 540 195 620"/>
  <path class="line" d="M 320 670 L 360 670"/>
  <path class="line" d="M 640 670 L 700 670"/>
  <path class="line" d="M 910 670 L 980 670"/>
  <path class="thin" d="M 805 720 C 805 765 490 765 490 465"/>

  <text class="note" x="375" y="490">No dissertation content is reused across topics.</text>
  <text class="note" x="830" y="490">Source-backed figures follow visual policy.</text>
  <text class="note" x="612" y="768">Professor feedback and returned survey results update the topic knowledge base.</text>
</svg>
